_schema-version: 3.3.0
ID: sales-order-approval
version: 1.0.0
description: "Event-Driven Sales Order Approval Extension on SAP BTP"

parameters:
  enable-parallel-deployments: false

build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - cp db/schema.cds worker/db/schema.cds
        - npx cds build --production

modules:
  - name: sales-order-approval-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      memory: 512M
      disk-quota: 1G
      buildpack: nodejs_buildpack
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api
        properties:
          srv-url: ${default-url}
    requires:
      - name: sales-order-approval-auth
      - name: sales-order-approval-db

  - name: sales-order-approval-db-deployer
    type: hdb
    path: gen/db
    parameters:
      memory: 256M
      disk-quota: 1G
      buildpack: nodejs_buildpack
    requires:
      - name: sales-order-approval-db

  - name: sales-order-approval-worker
    type: nodejs
    path: worker
    parameters:
      instances: 1
      memory: 256M
      disk-quota: 512M
      buildpack: nodejs_buildpack
      no-route: true
      health-check-type: process
    build-parameters:
      builder: npm-ci
    requires:
      - name: sales-order-approval-db
      - name: sales-order-approval-rabbitmq
      - name: sales-order-approval-process-automation

resources:
  - name: sales-order-approval-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: sales-order-approval-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - binding-secret
            - x509

  - name: sales-order-approval-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared

  - name: sales-order-approval-rabbitmq
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: sales-order-approval-rabbitmq

  - name: sales-order-approval-process-automation
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: sales-order-approval-process-automation
